<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReaRead Analytics Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="chart.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <h1>Analytics Dashboard</h1>
            </div>
            <div class="header-actions">
                <button id="export-btn" class="btn-secondary">Export Data</button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard-main">
        <!-- Hero Stats Section -->
        <section class="hero-stats">
            <div class="stat-card">
                <div class="stat-label">Reading Sessions</div>
                <div class="stat-value" id="sessions-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Time</div>
                <div class="stat-value" id="time-value">0 min</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average Focus</div>
                <div class="stat-value" id="focus-value">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Reading Speed</div>
                <div class="stat-value" id="speed-value">0 WPM</div>
            </div>
        </section>

        <!-- Charts Row -->
        <div class="charts-row">
            <!-- Focus Analysis -->
            <section class="section-card chart-card">
                <div class="section-header">
                    <h2>Focus Over Time</h2>
                </div>
                <canvas id="focus-chart"></canvas>
            </section>

            <!-- Reading Speed -->
            <section class="section-card chart-card">
                <div class="section-header">
                    <h2>Reading Speed</h2>
                </div>
                <canvas id="speed-chart"></canvas>
            </section>
        </div>

        <!-- Session History -->
        <section class="section-card">
            <div class="section-header">
                <h2>Recent Sessions</h2>
            </div>
            <div id="sessions-table" class="sessions-table">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>URL</th>
                            <th>Duration</th>
                            <th>Focus %</th>
                            <th>Paragraphs</th>
                        </tr>
                    </thead>
                    <tbody id="sessions-tbody">
                        <!-- Sessions will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
