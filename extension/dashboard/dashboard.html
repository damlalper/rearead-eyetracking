<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReaRead Analytics Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-content">
            <div class="logo">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <h1>ReaRead Analytics</h1>
            </div>
            <div class="header-actions">
                <button id="export-btn" class="btn-icon" title="Export Data">
                    <span>📊</span>
                </button>
                <button id="settings-btn" class="btn-icon" title="Settings">
                    <span>⚙️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard-main">
        <!-- Hero Stats Section -->
        <section class="hero-stats">
            <div class="stat-card streak">
                <div class="stat-icon">🔥</div>
                <div class="stat-content">
                    <div class="stat-value" id="streak-value">0</div>
                    <div class="stat-label">Day Streak</div>
                </div>
            </div>
            <div class="stat-card pages">
                <div class="stat-icon">📖</div>
                <div class="stat-content">
                    <div class="stat-value" id="pages-value">0</div>
                    <div class="stat-label">Pages Read</div>
                </div>
            </div>
            <div class="stat-card focus">
                <div class="stat-icon">🧠</div>
                <div class="stat-content">
                    <div class="stat-value" id="focus-value">0%</div>
                    <div class="stat-label">Avg Focus</div>
                </div>
            </div>
            <div class="stat-card speed">
                <div class="stat-icon">⚡</div>
                <div class="stat-content">
                    <div class="stat-value" id="speed-value">0</div>
                    <div class="stat-label">WPM</div>
                </div>
            </div>
        </section>

        <!-- Activity Heatmap -->
        <section class="section-card">
            <div class="section-header">
                <h2>Reading Activity</h2>
                <div class="time-range-selector">
                    <button class="range-btn active" data-range="30">30 days</button>
                    <button class="range-btn" data-range="90">90 days</button>
                    <button class="range-btn" data-range="365">1 year</button>
                </div>
            </div>
            <div id="activity-heatmap" class="heatmap-container">
                <!-- Heatmap will be generated here -->
            </div>
        </section>

        <!-- Charts Row -->
        <div class="charts-row">
            <!-- Focus Analysis -->
            <section class="section-card chart-card">
                <div class="section-header">
                    <h2>Focus Analysis</h2>
                </div>
                <canvas id="focus-chart"></canvas>
                <div class="chart-legend">
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #4CAF50"></span>
                        <span>In Bounds</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background: #f44336"></span>
                        <span>Out of Bounds</span>
                    </div>
                </div>
            </section>

            <!-- Reading Speed -->
            <section class="section-card chart-card">
                <div class="section-header">
                    <h2>Reading Speed Trends</h2>
                </div>
                <canvas id="speed-chart"></canvas>
            </section>
        </div>

        <!-- LLM Usage & Difficulty -->
        <div class="charts-row">
            <!-- LLM Assistance -->
            <section class="section-card chart-card">
                <div class="section-header">
                    <h2>AI Assistance Usage</h2>
                </div>
                <canvas id="llm-chart"></canvas>
            </section>

            <!-- Difficult Topics -->
            <section class="section-card">
                <div class="section-header">
                    <h2>Challenging Topics</h2>
                </div>
                <div id="difficulty-cloud" class="difficulty-cloud">
                    <!-- Tag cloud will be generated here -->
                </div>
            </section>
        </div>

        <!-- Gamification Section -->
        <section class="section-card">
            <div class="section-header">
                <h2>Achievements & Progress</h2>
            </div>

            <!-- Level Progress -->
            <div class="level-container">
                <div class="level-info">
                    <span class="level-badge" id="level-badge">Level 1</span>
                    <span class="level-title" id="level-title">Novice Reader</span>
                </div>
                <div class="level-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="xp-progress" style="width: 0%"></div>
                    </div>
                    <span class="progress-text" id="xp-text">0 / 100 XP</span>
                </div>
            </div>

            <!-- Badges Gallery -->
            <div class="badges-container" id="badges-container">
                <!-- Badges will be generated here -->
            </div>
        </section>

        <!-- Personalized Insights -->
        <section class="section-card insights-card">
            <div class="section-header">
                <h2>💡 Personalized Insights</h2>
            </div>
            <div id="insights-container" class="insights-list">
                <!-- Insights will be generated here -->
            </div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
